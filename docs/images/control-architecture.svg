<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1335" viewBox="0 0 1400 1335" role="img" aria-labelledby="title desc"><title id="title">PX4 ROS 2 Ground Control architecture</title><desc id="desc">The browser communicates with px4_gcs on HTTP port 8085 and WebSocket /ws. GCS sends trajectory waypoints and reset commands, switches controller active parameters and streams telemetry. The trajectory generator feeds /waypoint/current to the PID or LQR controller. PX4 exchanges versioned vehicle telemetry and Offboard topics through ROS 2 DDS and MicroXRCEAgent UDP port 8888. The trajectory visualizer publishes paths and markers for RViz2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs><rect width="1400" height="1335" fill="#f8fbfe"/><text x="64" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#142b43" text-anchor="start">PX4 + ROS 2 control architecture</text><text x="64" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Browser commands, trajectory generation, controller feedback and visualization</text><rect x="64" y="154" width="420" height="166" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M84 154 H464" stroke="#087f8c" stroke-width="5"/><text x="88" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">Browser dashboard</text><text x="88" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Telemetry, charts, trajectories</text><text x="88" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Controller selection and tuning</text><rect x="724" y="154" width="612" height="166" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M744 154 H1316" stroke="#087f8c" stroke-width="5"/><text x="748" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">px4_gcs</text><text x="748" y="234" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">FastAPI + rclpy in gcs_node.py</text><text x="748" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">HTTP :8085 | JSON WebSocket /ws</text><text x="748" y="296" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Vehicle commands + waypoint upload</text><path d="M496 208H710" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><path d="M710 273H496" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><text x="603" y="191" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#087f8c" text-anchor="middle">Commands</text><text x="603" y="302" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#087f8c" text-anchor="middle">Telemetry ~20 Hz</text><path d="M925 332V370H442V477" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><text x="64" y="410" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/trajectory/set_waypoints</text><text x="64" y="441" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/trajectory/reset</text><path d="M1188 332V477" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><text x="968" y="386" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#087f8c" text-anchor="start">ROS parameters</text><text x="968" y="418" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#50657a" text-anchor="start">active + gains</text><rect x="64" y="490" width="460" height="170" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M84 490 H504" stroke="#087f8c" stroke-width="5"/><text x="88" y="530" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">px4_gen_trajectory</text><text x="88" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Waypoint sequence + arrival check</text><text x="88" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Publishes /trajectory/status</text><rect x="876" y="490" width="460" height="170" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><path d="M896 490 H1316" stroke="#087f8c" stroke-width="5"/><text x="900" y="530" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#142b43" text-anchor="start">PID or LQR controller</text><text x="900" y="570" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">One selected via active parameter</text><text x="900" y="601" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">Position + velocity feedback</text><path d="M537 575 L864 575" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)"/><text x="567" y="548" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/waypoint/current</text><path d="M294 675V716" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><path d="M1106 675V716" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><rect x="64" y="731" width="1272" height="323" rx="24" fill="#f0f7fa" stroke="#d6e2ed" stroke-width="2" /><text x="94" y="778" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#142b43" text-anchor="start">ROS 2 / DDS</text><rect x="844" y="750" width="446" height="34" rx="17" fill="#f0f7fa" stroke="none" stroke-width="2" /><text x="860" y="774" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#087f8c" text-anchor="start">MicroXRCEAgent UDP :8888</text><text x="94" y="829" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#087f8c" text-anchor="start">PX4 telemetry to ROS nodes</text><text x="94" y="867" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/fmu/out/vehicle_local_position_v1</text><text x="94" y="902" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/fmu/out/vehicle_status_v3</text><text x="94" y="937" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/fmu/out/battery_status_v1</text><text x="762" y="829" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#087f8c" text-anchor="start">ROS commands to PX4</text><text x="762" y="867" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/fmu/in/trajectory_setpoint</text><text x="762" y="902" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/fmu/in/offboard_control_mode</text><text x="762" y="937" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">/fmu/in/vehicle_command</text><text x="94" y="1015" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Position feedback feeds the trajectory generator, controllers and GCS.</text><text x="762" y="1015" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#50657a" text-anchor="start">GCS also receives /ctrl/pid_debug and /ctrl/lqr_debug.</text><path d="M220 1054V1102" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><path d="M548 1102V1054" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><path d="M1050 1054V1102" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#arrow)" /><rect x="64" y="1117" width="652" height="133" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><rect x="754" y="1117" width="582" height="133" rx="20" fill="#ffffff" stroke="#d6e2ed" stroke-width="2" /><text x="94" y="1160" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#142b43" text-anchor="start">PX4 vehicle / SITL</text><text x="94" y="1202" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400" fill="#50657a" text-anchor="start">uXRCE-DDS client carries vehicle state and Offboard input.</text><text x="786" y="1160" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#142b43" text-anchor="start">RViz2: px4_trajectory_visualizer</text><text x="786" y="1202" font-family="Consolas,DejaVu Sans Mono,monospace" font-size="18" font-weight="400" fill="#50657a" text-anchor="start">/trajectory/path  |  /visualization/setpoint</text><text x="786" y="1232" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#50657a" text-anchor="start">Setpoint marker: finite positions only</text><text x="94" y="1297" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#50657a" text-anchor="start">Visualizer subscribes to local position and trajectory setpoint topics.</text></svg>